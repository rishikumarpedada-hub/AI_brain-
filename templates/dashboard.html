{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>Brain Scan Intake</h2>
  <p class="muted">Doctor: {{ doctor }} | DBIM-based segmentation + prediction</p>
  <form method="post" enctype="multipart/form-data" class="form-grid">
    <label>Patient Name
      <input type="text" name="patient_name" required>
    </label>
    <label>Age
      <input type="number" name="patient_age" min="1" max="120" required>
    </label>
    <label>Gender
      <select name="patient_gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </label>
    <label>Clinical Notes
      <textarea name="notes" rows="4" placeholder="Symptoms, history, observations..."></textarea>
    </label>
    <label>Scan Image (png/jpg/jpeg/bmp)
      <input type="file" name="scan_image" accept=".png,.jpg,.jpeg,.bmp" required>
    </label>
    <button type="submit">Save Patient + Predict</button>
  </form>
</section>
{% endblock %}
